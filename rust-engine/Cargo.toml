[package]
name = "KnowledgeGraphDatabase"
version = "0.1.0"
edition = "2021"

[dependencies]
# Memory-mapping: Allows us to treat a file on disk like an array in RAM
memmap2 = "0.9"
# Fast, fixed-width serialization
zerocopy = { version = "0.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
csv = "1.3"
# For unique identifiers for our nodes/edges
uuid = { version = "1.7", features = ["v4", "zerocopy"] }
# Fast hashing for our internal buffer cache
dashmap = "5.5"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
axum = "0.7.9"